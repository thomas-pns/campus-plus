name: Tests et image
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Serveur
        working-directory: server
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Appli
        working-directory: client
        run: npm ci && npm test && npm run build

  image:
    # Image Docker publiée sur GitHub Container Registry à chaque envoi sur main
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/campus-plus:latest
            ghcr.io/${{ github.repository_owner }}/campus-plus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
